<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Career Day - Space Skater</title>
<style>
body{margin:0;background:linear-gradient(135deg,#141414,#3a0a0d);color:#fff;font-family:system-ui,-apple-system,sans-serif;text-align:center}
h1{font-size:2.6rem;margin:.3em 0 0;color:#e50914;text-shadow:0 4px 20px rgba(229,9,20,.5)}
h2{font-size:1.2rem;font-weight:400;margin:.2em 0 .5em;opacity:.85}
canvas{background:#0b0b2a;border:4px solid #e50914;border-radius:12px;max-width:96vw}
p{font-size:1.3rem}
</style></head>
<body><h1>Space Skater</h1><h2><a href="./" style="color:#fff">← Back to Career Day</a></h2>
<canvas id="c" width="960" height="540"></canvas>
<p>⬅️ ➡️ or A / D to skate &nbsp;•&nbsp; ⬆️ / W / Space to jump &nbsp;•&nbsp; Dodge the aliens and reach your rocket!</p>
<script>
const c=document.getElementById('c'),x=c.getContext('2d'),W=960,H=540,G=0.7;
const keys={};onkeydown=e=>{keys[e.key.toLowerCase()]=1;if([' ','arrowup','arrowdown','arrowleft','arrowright'].includes(e.key.toLowerCase()))e.preventDefault();if(state!=='play'&&(e.key===' '||e.key==='Enter'))reset()};onkeyup=e=>keys[e.key.toLowerCase()]=0;
const plats=[[0,480,650],[760,480,450],[1300,400,200],[1560,480,2000],[1950,400,150],[2120,315,150],[2290,230,150],[2460,145,150],[2630,60,150],[2800,-25,150],[2970,-110,150],[3140,-195,150],[3310,-280,300]];
const goal={x:3420,y:-430};
let p,aliens,camX,camY=0,state,stars=[],flame=0,rocketY;
for(let i=0;i<150;i++)stars.push([Math.random()*5000,Math.random()*H,Math.random()*2+1]);
function reset(){p={x:60,y:400,vx:0,vy:0,w:40,h:56,on:false};camX=0;camY=0;state='play';rocketY=goal.y;
aliens=[[900,480,780,1190],[1650,480,1580,1900]].map(a=>({x:a[0],y:a[1]-40,min:a[2],max:a[3],d:1.6+Math.random()}))}
reset();
function update(){if(state!=='play')sfx.rolling(0,false);if(state==='win'){rocketY-=6;flame++;return}if(state!=='play')return;
const L=keys['arrowleft']||keys['a'],R=keys['arrowright']||keys['d'];
p.vx+= (R?0.6:0)-(L?0.6:0);p.vx*=0.92;p.vx=Math.max(-8,Math.min(8,p.vx));
if((keys['arrowup']||keys['w']||keys[' '])&&p.on){p.vy=-15;p.on=false;sfx.jump()}
p.vy+=G;p.x+=p.vx;p.y+=p.vy;if(p.x<0)p.x=0;const wasOn=p.on;p.on=false;
for(const[a,b,w]of plats)if(p.x+p.w>a&&p.x<a+w&&p.y+p.h>=b&&p.y+p.h-p.vy<=b+1){if(!wasOn&&p.vy>2)sfx.land();p.y=b-p.h;p.vy=0;p.on=true}
sfx.rolling(p.vx,p.on);if(p.y>H+100)state='lose';
for(const a of aliens){a.x+=a.d;if(a.x<a.min||a.x>a.max-40)a.d*=-1;a.y+=Math.sin(Date.now()/200+a.min)*0.6;
if(p.x+p.w-8>a.x&&p.x+8<a.x+40&&p.y+p.h-6>a.y&&p.y+6<a.y+40)state='lose'}
if(p.x+p.w>goal.x&&p.x<goal.x+80&&p.y+p.h>goal.y)state='win';
camX=Math.max(0,Math.min(p.x-300,3700-W));camY=Math.min(0,p.y-260)}
function astronaut(X,Y){x.fillStyle='#e50914';x.fillRect(X-4,Y+50,48,7);x.fillStyle='#333';x.beginPath();x.arc(X+6,Y+60,5,0,7);x.arc(X+34,Y+60,5,0,7);x.fill();
x.fillStyle='#fff';x.fillRect(X+8,Y+22,24,28);x.fillRect(X+4,Y+44,10,8);x.fillRect(X+26,Y+44,10,8);x.beginPath();x.arc(X+20,Y+14,15,0,7);x.fill();
x.fillStyle='#4fc3f7';x.beginPath();x.ellipse(X+24,Y+14,9,7,0,0,7);x.fill();x.fillStyle='#e50914';x.fillRect(X+14,Y+30,12,6)}
function alien(a){x.fillStyle='#7CFC00';x.beginPath();x.ellipse(a.x+20,a.y+24,20,16,0,0,7);x.fill();x.fillRect(a.x+8,a.y-4,4,12);x.fillRect(a.x+28,a.y-4,4,12);
x.fillStyle='#000';x.beginPath();x.arc(a.x+13,a.y+20,5,0,7);x.arc(a.x+27,a.y+20,5,0,7);x.fill()}
function rocket(X,Y){x.fillStyle='#ddd';x.fillRect(X+20,Y+40,40,110);x.fillStyle='#e50914';x.beginPath();x.moveTo(X+20,Y+40);x.lineTo(X+40,Y);x.lineTo(X+60,Y+40);x.fill();
x.beginPath();x.moveTo(X+20,Y+110);x.lineTo(X,Y+150);x.lineTo(X+20,Y+150);x.fill();x.beginPath();x.moveTo(X+60,Y+110);x.lineTo(X+80,Y+150);x.lineTo(X+60,Y+150);x.fill();
x.fillStyle='#4fc3f7';x.beginPath();x.arc(X+40,Y+70,10,0,7);x.fill();
if(state==='win'){x.fillStyle=flame%6<3?'#ffb300':'#ff5722';x.beginPath();x.moveTo(X+25,Y+150);x.lineTo(X+40,Y+200+Math.random()*30);x.lineTo(X+55,Y+150);x.fill()}}
function txt(s,y,sz,col){x.font='bold '+sz+'px system-ui';x.textAlign='center';x.fillStyle=col||'#fff';x.fillText(s,W/2,y)}
function draw(){x.fillStyle='#0b0b2a';x.fillRect(0,0,W,H);x.fillStyle='#fff';for(const[sx,sy,r]of stars)x.fillRect(((sx-camX*0.3)%W+W)%W,sy,r,r);
drawSky(x,camX,camY);x.save();x.translate(-camX,-camY);x.fillStyle='#5d4037';x.beginPath();x.moveTo(1900,600);x.lineTo(3460,-280);x.lineTo(3700,600);x.fill();x.fillStyle='#fff';x.beginPath();x.moveTo(3360,-200);x.lineTo(3460,-280);x.lineTo(3560,-200);x.fill();
for(const[a,b,w]of plats){x.fillStyle='#8e44ad';x.fillRect(a,b,w,H-b);x.fillStyle='#e50914';x.fillRect(a,b,w,10)}
rocket(goal.x,state==='win'?rocketY:goal.y-0);
for(const a of aliens)alien(a);if(state!=='win')astronaut(p.x,p.y);x.restore();
if(state==='lose'){x.fillStyle='rgba(0,0,0,.6)';x.fillRect(0,0,W,H);txt('Oh no! 👽',230,64,'#7CFC00');txt('Press SPACE to try again',300,36)}
if(state==='win'&&rocketY<goal.y-700){txt('🚀 BLAST OFF! You made it to space! 🚀',230,44,'#ffb300');txt('Press SPACE to play again',300,32)}}
(function loop(){update();draw();requestAnimationFrame(loop)})();
</script>
<script src="sky.js"></script><script src="sfx.js"></script><script src="music.js"></script><script src="live-reload.js"></script></body></html>
