<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="icon" type="image/svg+xml" href="favicon.svg"><title>Career Day - Space Skater</title>
<style>
body{margin:0;background:linear-gradient(135deg,#141414,#3a0a0d);color:#fff;font-family:system-ui,-apple-system,sans-serif;text-align:center}
h1{font-size:2.6rem;margin:.3em 0 0;color:#e50914;text-shadow:0 4px 20px rgba(229,9,20,.5)}
h2{font-size:1.2rem;font-weight:400;margin:.2em 0 .5em;opacity:.85}
canvas{background:#0b0b2a;border:4px solid #e50914;border-radius:12px;max-width:96vw}
p{font-size:1.3rem}
</style><script src="sky.js?v=1793068710"></script><script src="sfx.js?v=1793068710"></script><script src="levels.js?v=1793068710"></script><script src="aliens.js?v=1793068710"></script><script src="highscores.js?v=1793068710"></script></head>
<body><h1>Space Skater</h1>
<canvas id="c" width="960" height="540"></canvas>
<p>⬅️ ➡️ or A / D to skate &nbsp;•&nbsp; ⬆️ / W / Space to jump &nbsp;•&nbsp; B to fire laser &nbsp;•&nbsp; M to mute &nbsp;•&nbsp; Dodge the aliens and reach your rocket! &nbsp;•&nbsp; 10 levels!</p>
<script>
const c=document.getElementById('c'),x=c.getContext('2d'),W=960,H=540,G=0.55;
let lv=1,LV,plats,goal,best=1,card=0;try{best=Math.max(1,Math.min(10,+localStorage.getItem('ssBest')||1))}catch(e){}
function saveBest(){try{localStorage.setItem('ssBest',best)}catch(e){}}
const keys={};onkeydown=e=>{if(window.HS&&HS.active)return;const k=e.key.toLowerCase();if(k==='b'&&!e.repeat&&state==='play'&&card<=60){lasers.push({x:p.f>0?p.x+48:p.x-8,y:p.y+25,d:p.f,t:0});(sfx.laser&&sfx.laser())}keys[k]=1;if([' ','arrowup','arrowdown','arrowleft','arrowright'].includes(k))e.preventDefault();
if(state==='menu'||state==='lose'||state==='beat'){if(/^[0-9]$/.test(k)){const n=k==='0'?10:+k;if(n<=best)startLevel(n)}else if(state==='lose'&&k==='s')submitRun();else if(k===' '||k==='enter'){if(state==='lose')startLevel(lv,true);else startLevel(state==='beat'?1:lv)}}};onkeyup=e=>keys[e.key.toLowerCase()]=0;
c.addEventListener('click',e=>{if(window.HS&&HS.active)return;if(state!=='menu'&&state!=='lose'&&state!=='beat')return;const r=c.getBoundingClientRect(),mx=(e.clientX-r.left)*W/r.width,my=(e.clientY-r.top)*H/r.height;
if(state==='lose'&&mx>W/2-130&&mx<W/2+130&&my>295&&my<340)return submitRun();
for(let i=1;i<=10;i++){const b=btn(i);if(mx>b[0]&&mx<b[0]+60&&my>b[1]&&my<b[1]+60&&i<=best)return startLevel(i)}});
function btn(i){return[W/2-355+(i-1)*72,380]}
let lasers=[],poofs=[],p,aliens,camX,camY=0,state='menu',stars=[],flame=0,rocketY;
for(let i=0;i<150;i++)stars.push([Math.random()*5000,Math.random()*H,Math.random()*2+1]);
// Scoring: aliens by type, level-clear bonus, time bonus. Run score carries across levels; dying resets to the score at level start.
const PTS={walker:100,hopper:150,saucer:200,chaser:250,big:500};let score=0,lvStart=0,lvT=0,bonusMsg='',submitted=false;
function submitRun(){if(submitted)return;submitted=true;try{window.HS&&HS.endRun(lvStart,lv)}catch(e){console.error(e)}}
function startLevel(n,keep){if(keep)score=lvStart;else if(state!=='win')score=0;lvStart=score;lvT=0;submitted=false;lv=n;LV=LEVELS[n-1];plats=LV.plats;goal=LV.goal;card=150;reset()}
function reset(){p={f:1,x:60,y:400,vx:0,vy:0,w:40,h:56,on:false};camX=0;camY=0;state='play';rocketY=goal.y;lasers=[];poofs=[];
aliens=LV.aliens.map(ALIENS.make)}
LV=LEVELS[0];plats=LV.plats;goal=LV.goal;reset();state='menu';
function squish(a){a.dead=1;score+=PTS[a.t]||100;(sfx.squash&&sfx.squash());poofs.push({x:a.x+a.w/2,y:a.y+a.h/2,t:0,col:a.col})}
function update(){if(state!=='play')sfx.rolling(0,false);if(state==='win'){rocketY-=6;flame++;if(rocketY<goal.y-900){if(lv<10){best=Math.max(best,lv+1);saveBest();startLevel(lv+1)}else{state='beat';lvStart=score;lv=10;submitRun()}}return}if(state!=='play')return;
if(card>0)card--;if(card>60){camX=0;return}lvT++;
const L=keys['arrowleft']||keys['a'],R=keys['arrowright']||keys['d'];
p.vx+= (R?0.6:0)-(L?0.6:0);p.vx*=0.92;if(R)p.f=1;if(L)p.f=-1;p.vx=Math.max(-8,Math.min(8,p.vx));
if((keys['arrowup']||keys['w']||keys[' '])&&p.on){p.vy=-13.3;p.on=false;(sfx.jump&&sfx.jump())}
p.vy+=G;const px0=p.x;p.x+=p.vx;p.y+=p.vy;if(p.x<0)p.x=0;const wasOn=p.on;p.on=false;
for(const[a,b,w]of plats)if(p.x+p.w>a&&p.x<a+w&&p.y+p.h>=b&&p.y+p.h-p.vy<=b+1){if(!wasOn&&p.vy>2)(sfx.land&&sfx.land());p.y=b-p.h;p.vy=0;p.on=true}
for(const[a,b,w]of plats)if(p.x+p.w>a&&p.x<a+w&&p.y+p.h>b+4&&p.y<H){if(px0+p.w<=a+1){p.x=a-p.w;p.vx=0}else if(px0>=a+w-1){p.x=a+w;p.vx=0}}sfx.rolling(p.vx,p.on);if(p.y>H+100)state='lose';
for(const a of aliens){ALIENS.move(a,p);
if(!a.dead&&p.x+p.w-8>a.x&&p.x+8<a.x+a.w&&p.y+p.h-6>a.y&&p.y+6<a.y+a.h){if(p.vy>0&&p.y+p.h-p.vy<=a.y+Math.max(18,a.h*0.5)+Math.abs(a.vy||0)){p.vy=-9.75;squish(a)}else state='lose'}}
for(const l of lasers){l.x+=l.d*20;l.t++;for(const a of aliens)if(!a.dead&&l.t<99&&l.x>a.x-10&&l.x<a.x+a.w+10&&l.y>a.y-10&&l.y<a.y+a.h+5){l.t=99;if(--a.hp<=0)squish(a);else{a.flash=8;(sfx.land&&sfx.land())}}}lasers=lasers.filter(l=>l.t<45);aliens=aliens.filter(a=>!a.dead);
if(p.x+p.w>goal.x+20&&p.x<goal.x+60&&p.y<goal.y+45&&p.y+p.h>goal.y){state='win';const lb=500*lv,tb=Math.max(0,Math.round((120-lvT/60)*10));score+=lb+tb;bonusMsg='Level bonus +'+lb+'  •  Time bonus +'+tb}
camX=Math.max(0,Math.min(p.x-300,LV.end-W));camY=Math.min(0,p.y-260)}
function astronaut(X,Y,f){Y+=Math.sin(Date.now()/150)*2-8;x.fillStyle='rgba(0,229,255,.35)';x.beginPath();x.ellipse(X+20,Y+64,26,5,0,0,7);x.fill();x.fillStyle='#e50914';x.beginPath();x.ellipse(X+20,Y+53,26,5,0,0,7);x.fill();x.fillStyle='#00e5ff';x.fillRect(X+2,Y+56,36,3);x.fillStyle='#999';x.fillRect(f>0?X+30:X-8,Y+30,18,6);
x.fillStyle='#fff';x.fillRect(X+8,Y+22,24,28);x.fillRect(X+4,Y+44,10,8);x.fillRect(X+26,Y+44,10,8);x.beginPath();x.arc(X+20,Y+14,15,0,7);x.fill();
x.fillStyle='#4fc3f7';x.beginPath();x.ellipse(X+24,Y+14,9,7,0,0,7);x.fill();x.fillStyle='#e50914';x.fillRect(X+14,Y+30,12,6)}
function rocket(X,Y){x.fillStyle='#ddd';x.fillRect(X+20,Y+40,40,110);x.fillStyle='#e50914';x.beginPath();x.moveTo(X+20,Y+40);x.lineTo(X+40,Y);x.lineTo(X+60,Y+40);x.fill();
x.beginPath();x.moveTo(X+20,Y+110);x.lineTo(X,Y+150);x.lineTo(X+20,Y+150);x.fill();x.beginPath();x.moveTo(X+60,Y+110);x.lineTo(X+80,Y+150);x.lineTo(X+60,Y+150);x.fill();
x.fillStyle='#4fc3f7';x.beginPath();x.arc(X+40,Y+70,10,0,7);x.fill();
if(state==='win'){x.fillStyle=flame%6<3?'#ffb300':'#ff5722';x.beginPath();x.moveTo(X+25,Y+150);x.lineTo(X+40,Y+200+Math.random()*30);x.lineTo(X+55,Y+150);x.fill()}}
function txt(s,y,sz,col){x.font='bold '+sz+'px system-ui';x.textAlign='center';x.fillStyle=col||'#fff';x.fillText(s,W/2,y)}
const NAMES=['First Flight','Moon Hop','Purple Bounce','Crater Climb','Saucer Skies','Red Alert','Comet Canyon','Big Trouble','Nebula Run','Galaxy Boss'];
function levelSelect(){txt('Pick a level (press 1-9, 0 = 10, or click)',360,22,'#ccc');for(let i=1;i<=10;i++){const[bx,by]=btn(i),ok=i<=best;x.fillStyle=ok?(i===lv?'#e50914':'#8e44ad'):'#333';x.fillRect(bx,by,60,60);x.font='bold 28px system-ui';x.textAlign='center';x.fillStyle=ok?'#fff':'#777';x.fillText(ok?i:'🔒',bx+30,by+41)}}
function draw(){x.fillStyle='#0b0b2a';x.fillRect(0,0,W,H);x.fillStyle='#fff';for(const[sx,sy,r]of stars)x.fillRect(((sx-camX*0.3)%W+W)%W,sy,r,r);
drawSky(x,camX,camY);x.save();x.translate(-camX,-camY);const[m0,mp,my]=LV.mtn;x.fillStyle='#5d4037';x.beginPath();x.moveTo(m0,600);x.lineTo(mp,my);x.lineTo(LV.end,600);x.fill();x.fillStyle='#fff';x.beginPath();x.moveTo(mp-100,my+80);x.lineTo(mp,my);x.lineTo(mp+100,my+80);x.fill();
for(const[a,b,w]of plats){x.fillStyle='#8e44ad';x.fillRect(a,b,w,H-b);x.fillStyle='#e50914';x.fillRect(a,b,w,10)}
rocket(goal.x,state==='win'?rocketY:goal.y-0);
for(const l of lasers){x.strokeStyle='#ff1744';x.lineWidth=6;x.shadowColor='#ff1744';x.shadowBlur=15;x.beginPath();x.moveTo(l.x,l.y);x.lineTo(l.x-l.d*50,l.y);x.stroke();x.strokeStyle='#fff';x.lineWidth=2;x.stroke();x.shadowBlur=0}for(const a of aliens)ALIENS.draw(x,a);for(const f of poofs){f.t++;x.globalAlpha=Math.max(0,1-f.t/30);x.fillStyle=f.col||'#7CFC00';for(let i=0;i<8;i++){const g=i*Math.PI/4;x.beginPath();x.arc(f.x+Math.cos(g)*f.t*2,f.y+Math.sin(g)*f.t*2,5,0,7);x.fill()}x.font='bold 26px system-ui';x.textAlign='center';x.fillStyle='#ffeb3b';x.fillText('SQUISH!',f.x,f.y-20-f.t);x.globalAlpha=1}poofs=poofs.filter(f=>f.t<30);if(state!=='win'&&state!=='beat')astronaut(p.x,p.y,p.f);x.restore();
if(state!=='menu'){x.font='bold 26px system-ui';x.textAlign='left';x.fillStyle='#fff';x.fillText('Level '+lv,16,36);x.textAlign='right';x.fillText('👽 '+aliens.length,W-16,36);x.textAlign='center';x.fillStyle='#ffeb3b';x.fillText('⭐ '+score.toLocaleString(),W/2,36)}
if(state==='play'&&card>0){x.globalAlpha=Math.min(1,card/30);x.fillStyle='rgba(0,0,0,.55)';x.fillRect(0,170,W,170);txt('Level '+lv,245,72,'#ffb300');txt(NAMES[lv-1],300,34);x.globalAlpha=1}
if(state==='menu'){x.fillStyle='rgba(0,0,0,.6)';x.fillRect(0,0,W,H);txt('🛹 Space Skater 🚀',170,64,'#ffb300');txt('10 levels of aliens. Reach the rocket on every mountain!',230,26);txt('Press SPACE to start Level '+lv,290,34,'#7CFC00');levelSelect()}
if(state==='lose'){x.fillStyle='rgba(0,0,0,.6)';x.fillRect(0,0,W,H);txt('Oh no! 👽',200,64,'#7CFC00');txt('Press SPACE to try Level '+lv+' again',260,36);if(!submitted&&lvStart>0){x.fillStyle='#e50914';x.fillRect(W/2-130,295,260,45);txt('Submit score '+lvStart.toLocaleString()+' (S)',326,22)}else txt('Score: '+lvStart.toLocaleString(),326,24,'#ffeb3b');levelSelect()}
if(state==='win'&&rocketY<goal.y-500)txt(lv<10?'🚀 BLAST OFF! On to Level '+(lv+1)+'! 🚀':'🚀 BLAST OFF! 🚀',230,44,'#ffb300');if(state==='win')txt(bonusMsg,280,26,'#ffeb3b');
if(state==='beat'){x.fillStyle='rgba(0,0,0,.6)';x.fillRect(0,0,W,H);txt('🏆 You beat Space Skater! 🏆',150,58,'#ffb300');txt('All 10 levels! You are a real space hero!',215,30);txt('Final score: '+score.toLocaleString(),255,30,'#ffeb3b');txt('Press SPACE to play again',300,30,'#7CFC00');levelSelect()}}
let shownPanel=null;(function loop(){try{const want=true;if(want!==shownPanel&&window.HS&&HS.show){shownPanel=want;HS.show(want)}}catch(e){}try{update();draw()}catch(e){console.error(e)}requestAnimationFrame(loop)})();
</script>
<script src="music.js?v=1793068710"></script><script src="live-reload.js?v=1793068710"></script></body></html>
